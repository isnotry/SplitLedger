    tr.srow .smeta { display: block; margin: 0 0 1px; font-size: 11px; }
    tr.srow .stitle { display: block; }

/** 全角/中文标点归一化，让中文输入法下随手打出来的数字也能识别 */
function normalize(line) {
  return String(line)
    .replace(/[\uFF10-\uFF19]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)) // ０-９
    .replace(/\uFF0E/g, '.')   // ．
    .replace(/\uFF0C/g, ',')   // ，
    .replace(/\uFF0B/g, '+')   // ＋
    .replace(/[\uFF0D\u2013\u2014]/g, '-'); // － – —
}

/** 取一行里最后一个数字（支持 +/-、千分位、小数），返回 {value, index, end} 或 null */
function findLastNumber(s) {
  const re = /[+-]?\d[\d,]*(?:\.\d+)?/g;
  let m, last = null;
  while ((m = re.exec(s)) !== null) {
    const raw = m[0];
    if (!/\d/.test(raw)) continue;
    last = { raw, index: m.index, end: m.index + raw.length };
  }
  if (!last) return null;
  const value = parseFloat(last.raw.replace(/,/g, ''));
  if (!isFinite(value)) return null;
  return { raw: last.raw, value, index: last.index, end: last.end };
}

/** 去掉金额后剩下的摘要：清掉结尾单位与前后标点 */
function buildLabel(line, token) {
  let s = line.slice(0, token.index) + line.slice(token.end);
  return s
    .replace(/[元块¥￥]/g, '')
    .replace(/^[\s:：,，、\-–—]+/, '')
    .replace(/[\s:：,，、\-–—]+$/, '')
    .trim();
}

/**
 * 解析整段文本（与界面语言无关）。
 * @param {string} text
 * @param {'out'|'in'} defaultDir 无符号数字的默认方向
 * @returns {{items:Array, total:number, income:number, expense:number, count:number, skipped:number}}
 */
function parseLedger(text, defaultDir) {
  const items = [];
  let total = 0, income = 0, expense = 0, count = 0, skipped = 0;
  const lines = String(text || '').split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (!raw.trim()) continue;
    const line = normalize(raw);
    const token = findLastNumber(line);
    if (!token) {
      skipped++;
      items.push({ line: i + 1, label: raw.trim(), amount: null, dir: null, raw: raw.trim() });
      continue;
    }
    const explicitPlus = token.raw.trim().startsWith('+');
    const explicitMinus = token.raw.trim().startsWith('-');
    let dir;
    if (explicitPlus) dir = 'in';
    else if (explicitMinus) dir = 'out';
    else dir = defaultDir === 'in' ? 'in' : 'out';

    const magnitude = Math.abs(token.value);
    if (dir === 'in') income += magnitude; else expense += magnitude;
    total += dir === 'in' ? magnitude : -magnitude;
    count++;
    items.push({
      line: i + 1,
      label: buildLabel(line, token),
      amount: magnitude,
      signed: dir === 'in' ? magnitude : -magnitude,
      dir,
      raw: raw.trim(),
    });
  }
  return { items, total, income, expense, count, skipped };
}
/* --- core:end --- */

function currentLang() { return curLang === 'en' ? 'en' : 'zh'; }
function syncLangUI() {
  document.querySelectorAll('.langsw .lang').forEach((b) => {
    const on = b.dataset.lang === curLang;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
function setLang(l) { curLang = l === 'en' ? 'en' : 'zh'; syncLangUI(); }
/** 扫描所有 data-i18n 元素并替换文案；语言相关但不在 DOM 属性里的由 render() 处理 */

  const lang = currentLang();
  document.documentElement.lang = I18N[lang].htmlLang;
  document.title = I18N[lang].title;
  document.querySelectorAll('[data-i18n]').forEach((el) => {

    if (v !== undefined) el.textContent = v;

/* ------------------------------ 界面 ------------------------------ */
const $ = (id) => document.getElementById(id);
const input = $('input');
const STORE_KEY = 'ledger-mini/v1';
const fmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/** 币种跟随界面语言：中文 ¥ / 英文 $（数字分组两者一致，只换符号；负数把负号提到符号前） */
const money = (n) => (n < 0 ? '−' : '') + (t('cur') || '¥') + fmt.format(Math.abs(n));
const langOf = () => currentLang();

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => el.classList.remove('show'), 1600);
}

function render() {
  const r = parseLedger(input.value, $('defaultDir').value);

  $('sTotal').textContent = money(r.total);
  $('sTotal').className = 'v ' + (r.total > 0 ? 'in' : r.total < 0 ? 'out' : '');
  $('sIn').textContent = money(r.income);
  $('sOut').textContent = money(r.expense);
  $('sCount').textContent = String(r.count);
  $('sSkip').textContent = String(r.skipped);

  renderRecords(r);
  renderSettle();
  save();
}

/** 分隔行：「未保存」/「已保存」 */
function sectionRow(label) {
  const tr = document.createElement('tr');
  tr.className = 'sec';
  const td = document.createElement('td');
  td.colSpan = 4;
  td.textContent = label;
  tr.appendChild(td);
  return tr;
}

/** 编辑区里还没保存的一行 */
function detailRow(it) {
  const tr = document.createElement('tr');
  if (it.amount === null) tr.className = 'no-num';
  const td1 = document.createElement('td');
  td1.textContent = it.line;
  const td2 = document.createElement('td');
  td2.textContent = it.label || t('noNote');
  const td3 = document.createElement('td');
  td3.className = 'num amount';
  if (it.amount !== null) {
    td3.textContent = (it.dir === 'in' ? '+' : '−') + fmt.format(it.amount);
    td3.classList.add(it.dir === 'in' ? 'in' : 'out');
  } else {
    td3.textContent = '—';
  }
  const td4 = document.createElement('td');
  tr.append(td1, td2, td3, td4);
  return tr;
}

/** 一条已保存的记录（本来就是一行，带删除） */
function savedRow(it, i) {
  const tr = document.createElement('tr');
  tr.className = 'srow';

  const td1 = document.createElement('td');
  td1.textContent = i + 1;

  const td2 = document.createElement('td');
  const meta = document.createElement('span');
  meta.className = 'smeta';
  meta.textContent = fmtTime(it.at);
  const label = document.createElement('span');
  label.className = 'stitle';
  label.textContent = it.label || t('noNote');
  td2.append(meta, label);

  const td3 = document.createElement('td');
  td3.className = 'num amount ' + (it.dir === 'in' ? 'in' : 'out');
  td3.textContent = (it.dir === 'in' ? '+' : '−') + fmt.format(it.amount || 0);

  const td4 = document.createElement('td');
  td4.className = 'ops';
  const bDel = document.createElement('button');
  bDel.className = 'danger';
  bDel.textContent = t('del');
  bDel.addEventListener('click', () => delItem(i));
  td4.appendChild(bDel);

  tr.append(td1, td2, td3, td4);
  return tr;
}

/** 合计行：已保存所有记录的净额 + 一键清空 */
function sumRow(amount) {
  const tr = document.createElement('tr');
  tr.className = 'trow';
  const td1 = document.createElement('td');
  td1.colSpan = 2;
  td1.textContent = t('sumLabel');
  const td2 = document.createElement('td');
  td2.className = 'num amount ' + (amount > 0 ? 'in' : amount < 0 ? 'out' : '');
  td2.textContent = (amount > 0 ? '+' : amount < 0 ? '−' : '') + fmt.format(Math.abs(amount));
  const td3 = document.createElement('td');
  td3.className = 'ops';
  const bClear = document.createElement('button');
  bClear.className = 'danger';
  bClear.textContent = t('clear');
  bClear.addEventListener('click', clearSaved);
  td3.appendChild(bClear);
  tr.append(td1, td2, td3);
  return tr;
}

/** 清空全部已保存记录（二次确认） */
function clearSaved() {
  if (!saved.length) return;
  if (!confirm(t('clearSavedConfirm'))) return;
  saved = [];
  persistSaved();
  render();
  toast(t('clearedToast'));
}

/** 一张表：上面是编辑区未保存的行，下面是已保存的记录（每条一行） */
function renderRecords(r) {
  const tbody = $('rows');
  tbody.innerHTML = '';
  const cur = r.items.filter((it) => it.amount !== null || it.raw);
  $('empty').textContent = t('empty');
  $('empty').style.display = cur.length || saved.length ? 'none' : 'block';

  const cnt = (n, k1, kN) => t(n === 1 ? k1 : kN).replace('{n}', n);
  if (cur.length) {
    tbody.appendChild(sectionRow(t('secCurrent') + ' · ' + cnt(r.count, 'savedMeta1', 'savedMetaN')));
    for (const it of cur) tbody.appendChild(detailRow(it));
  }
  if (saved.length) {
    tbody.appendChild(sectionRow(t('secSaved') + ' · ' + cnt(saved.length, 'savedMeta1', 'savedMetaN')));
    saved.forEach((it, i) => tbody.appendChild(savedRow(it, i)));
    const sum = saved.reduce((s, x) => s + (x.dir === 'in' ? x.amount : -x.amount), 0);
    tbody.appendChild(sumRow(sum));
  }
}

/* ---------------------------- 结算（AA 平摊） ---------------------------- */
/** 把输入框里的字符串解析成金额（复用全角归一化 + 末位数字规则），认不出来按 0 */
function parseAmount(str) {
  const tok = findLastNumber(normalize(String(str == null ? '' : str)));
  return tok ? Math.abs(tok.value) : 0;
}

/**
 * 结算口径：账本里记的是**我付的钱**，TA 付的那部分另外填（TA 已付），
 * 两者都算进共同开销，再 AA 平摊。
 *   mine  = 支出 − 收入        我这一方的净垫付
 *   paid  = TA 已付            TA 垫的部分（也计入总数、同样要 ÷2）
 *   total = mine + paid        两人合计已付
 *   each  = total ÷ 2          每人应承担
 *   diff  = each − paid        >0 → TA 补给我；<0 → 我补给 TA
 *          （等价于 (mine − paid) ÷ 2：谁垫得多谁收钱）
 */
function settleData() {
  let income = 0, expense = 0;
  for (const x of saved) {
    if (x.dir === 'in') income += x.amount; else expense += x.amount;
  }
  const mine = expense - income;
  const paid = parseAmount($('paidOther').value);
  const total = mine + paid;
  const each = total / 2;
  return { income, expense, mine, paid, total, each, diff: each - paid };
}

function renderSettle() {
  $('settle').style.display = saved.length ? '' : 'none';
  if (!saved.length) return;

  const s = settleData();
  const even = Math.abs(s.diff) < 0.005;   // 半分钱以内算两清，避开浮点误差

  const out = $('settleOut');
  out.className = 'settle-out ' + (even ? '' : s.diff > 0 ? 'in' : 'out');
  out.innerHTML = '';
  const lb = document.createElement('span');
  lb.className = 'so-label';
  lb.textContent = even ? t('settleEven') : s.diff > 0 ? t('settleToMe') : t('settleToThem');
  out.appendChild(lb);
  if (!even) {
    const am = document.createElement('span');
    am.className = 'so-amt';
    am.textContent = money(Math.abs(s.diff));
    out.appendChild(am);
  }

  const rows = [
    [t('fxMine'), money(s.mine), t('fxMineExp').replace('{e}', money(s.expense)).replace('{i}', money(s.income))],
    [t('fxTotal'), money(s.total), t('fxTotalExp').replace('{m}', money(s.mine)).replace('{p}', money(s.paid))],
    [t('fxEach'), money(s.each), t('fxEachExp').replace('{t}', money(s.total))],
    [t('fxDiff'), money(Math.abs(s.diff)), t('fxDiffExp').replace('{e}', money(s.each)).replace('{p}', money(s.paid))],
  ];
  const fx = $('settleFx');
  fx.innerHTML = '';
  for (const [k, v, exp] of rows) {
    const row = document.createElement('div');
    row.className = 'fx-row';
    const a = document.createElement('span'); a.className = 'fx-k'; a.textContent = k;
    const b = document.createElement('span'); b.className = 'fx-v'; b.textContent = v;
    const c = document.createElement('span'); c.className = 'fx-exp'; c.textContent = '= ' + exp;
    row.append(a, b, c);
    fx.appendChild(row);
  }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      text: input.value, dir: $('defaultDir').value, lang: langOf(), paid: $('paidOther').value,
    }));
  } catch (e) { /* 隐私模式下忽略 */ }
}
function load() {
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { /* 忽略 */ }
  if (draft && typeof draft.text === 'string') {
    input.value = draft.text;
    if (draft.dir) $('defaultDir').value = draft.dir;
    if (draft.lang) setLang(draft.lang);
    if (draft.paid) $('paidOther').value = draft.paid;
  } else {
    // 首次访问：跟随浏览器语言
    const nav = (navigator.language || '').toLowerCase();
    setLang(nav.startsWith('en') ? 'en' : 'zh');
  }
}

/* ---------------------------- 已保存快照 ---------------------------- */
const SAVED_KEY = 'ledger-mini/saved/v1';
let saved = [];

function loadSaved() {
  let raw = [];
  try {
    const v = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]');
    raw = Array.isArray(v) ? v : [];
  } catch (e) { raw = []; }

  const out = [];
  for (const x of raw) {
    if (!x) continue;
    if (typeof x.label === 'string' && typeof x.amount === 'number') {
      // 现行格式：一条 = 编辑区里的一行
      out.push({ at: x.at || Date.now(), label: x.label, amount: x.amount, dir: x.dir === 'in' ? 'in' : 'out' });
    } else if (typeof x.text === 'string') {
      // 旧格式：一次保存一整批 → 展开成逐条，避免历史数据被丢掉
      const r = parseLedger(x.text, x.dir || 'out');
      const at = x.at || Date.now();
      for (const it of r.items) {
        if (it.amount === null) continue;
        out.push({ at, label: it.label, amount: it.amount, dir: it.dir });
      }
    }
  }
  saved = out;
}
function persistSaved() {
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(saved)); } catch (e) { /* 隐私模式下忽略 */ }
}
/** 时间戳 → 本地化短日期（跟随界面语言，统一用 24 小时制：中英格式一致且更省宽度） */
function fmtTime(ts) {
  const loc = currentLang() === 'en' ? 'en-US' : 'zh-CN';
  try {
    return new Date(ts).toLocaleString(loc, {
      month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
    });
  } catch (e) { return ''; }
}

/** 保存：把编辑区内容按行拆成一条条记录（新的排在最上面），存完清空编辑区 */
function saveItem() {
  if (!input.value.trim()) { toast(t('emptySave')); input.focus(); return; }
  const r = parseLedger(input.value, $('defaultDir').value);
  const at = Date.now();
  const batch = r.items
    .filter((x) => x.amount !== null)
    .map((x) => ({ at, label: x.label, amount: x.amount, dir: x.dir }));

  if (!batch.length) { toast(t('saveNoNum')); input.focus(); return; }
  saved = batch.concat(saved);
  persistSaved();
  input.value = '';
  render();
  toast(t(batch.length === 1 ? 'savedToast1' : 'savedToastN').replace('{n}', batch.length));
}

function delItem(i) {
  if (!saved[i]) return;
  saved.splice(i, 1);
  persistSaved();
  render();
  toast(t('deletedToast'));
}
/* ------------------------------------------------------------------- */

/* ---------------------------- 导出图片 ---------------------------- */
/* 把「记录 + AA 结算」画成一张长图 PNG：宽度固定 720 逻辑像素，
   配色直接读当前主题的 CSS 变量（所以浅色/深色都跟着走）。 */
const IMG_W = 720, IMG_PAD = 36;
const IMG_FONT = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
const imgFont = (size, weight) => (weight || 400) + ' ' + size + 'px ' + IMG_FONT;

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/** 按当前字体截断文本，超出宽度用 … 收尾（调用前必须先设好 c.font） */
function clipText(c, s, maxW) {
  s = String(s == null ? '' : s);
  if (c.measureText(s).width <= maxW) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (c.measureText(s.slice(0, mid) + '…').width <= maxW) lo = mid; else hi = mid - 1;
  }
  return s.slice(0, lo) + '…';
}

function exportImage() {
  const r = parseLedger(input.value, $('defaultDir').value);
  const cur = r.items.filter((it) => it.amount !== null);
  const hasSaved = saved.length > 0;
  if (!cur.length && !hasSaved) { toast(t('imgEmpty')); return; }

  const cs = getComputedStyle(document.documentElement);
  const cssVar = (k, fb) => (cs.getPropertyValue(k) || '').trim() || fb;
  const C = {
    page: cssVar('--bg', '#f4f5f7'), card: cssVar('--card', '#ffffff'),
    text: cssVar('--text', '#1f2328'), muted: cssVar('--muted', '#6b7280'),
    border: cssVar('--border', '#e3e6ea'), inc: cssVar('--in', '#0f9d58'), outc: cssVar('--out', '#d92d20'),
  };
  const W = IMG_W, PAD = IMG_PAD, CW = W - PAD * 2, RX = W - PAD;

  const MAX_ROWS = 200;                       // 超长账本只画最近 200 条，尾部注明
  const shown = saved.slice(0, MAX_ROWS);
  const rest = saved.length - shown.length;
  const savedIncome = saved.reduce((a, x) => a + (x.dir === 'in' ? x.amount : 0), 0);
  const savedExpense = saved.reduce((a, x) => a + (x.dir === 'out' ? x.amount : 0), 0);
  const savedSum = savedIncome - savedExpense;
  // 图上那张合计卡的口径 = 图内全部行（未保存 + 已保存）。
  // 页面顶部的卡片只看编辑区，保存后就是 0 —— 直接搬过来会和下面的明细自相矛盾。
  const gIncome = r.income + savedIncome;
  const gExpense = r.expense + savedExpense;
  const gCount = cur.length + saved.length;
  const gTotal = gIncome - gExpense;
  const s2 = hasSaved ? settleData() : null;
  const cnt = (n) => t(n === 1 ? 'savedMeta1' : 'savedMetaN').replace('{n}', n);

  // 先按逻辑坐标排块（每块自带高度与绘制函数），再据此定画布尺寸
  const blocks = [];
  const add = (h, draw) => blocks.push({ h, draw });

  add(28, (c, y) => { c.font = imgFont(22, 700); c.fillStyle = C.text; c.fillText(t('appTitle'), PAD, y + 21); });
  add(22, (c, y) => { c.font = imgFont(12); c.fillStyle = C.muted; c.fillText(t('imgMadeAt').replace('{d}', fmtTime(Date.now())), PAD, y + 13); });
  add(10, () => {});

  add(118, (c, y) => {
    roundRect(c, PAD, y, CW, 118, 12);
    c.fillStyle = C.card; c.fill();
    c.strokeStyle = C.border; c.lineWidth = 1; c.stroke();
    c.font = imgFont(12); c.fillStyle = C.muted;
    c.fillText(t('total'), PAD + 20, y + 32);
    c.font = imgFont(30, 700);
    c.fillStyle = gTotal > 0 ? C.inc : gTotal < 0 ? C.outc : C.text;
    c.fillText(money(gTotal), PAD + 20, y + 78);
    c.textAlign = 'right';
    const line = (i, k, val, col) => {
      c.font = imgFont(13); c.fillStyle = C.muted;
      c.fillText(k, RX - 138, y + 32 + i * 28);
      c.fillStyle = col;
      c.fillText(val, RX - 20, y + 32 + i * 28);
    };
    line(0, t('income'), money(gIncome), C.inc);
    line(1, t('expense'), money(gExpense), C.outc);
    line(2, t('count'), String(gCount), C.text);
    c.textAlign = 'left';
  });
  add(18, () => {});

  add(22, (c, y) => { c.font = imgFont(13, 600); c.fillStyle = C.muted; c.fillText(t('recordTitle'), PAD, y + 14); });
  add(26, () => {});

  const drawRow = (c, y, left, label, amount, dir) => {
    c.font = imgFont(12); c.fillStyle = C.muted;
    c.fillText(clipText(c, left, 96), PAD, y + 21);
    c.font = imgFont(13); c.fillStyle = C.text;
    c.fillText(clipText(c, label, CW - 104 - 126), PAD + 104, y + 21);
    c.textAlign = 'right';
    c.font = imgFont(13, 600); c.fillStyle = dir === 'in' ? C.inc : C.outc;
    c.fillText((dir === 'in' ? '+' : '−') + fmt.format(amount || 0), RX, y + 21);
    c.textAlign = 'left';
    c.strokeStyle = C.border; c.lineWidth = 1;
    c.beginPath(); c.moveTo(PAD, y + 31.5); c.lineTo(RX, y + 31.5); c.stroke();
  };
  const drawSec = (label) => (c, y) => { c.font = imgFont(11, 600); c.fillStyle = C.muted; c.fillText(label, PAD, y + 16); };

  if (cur.length) {
    add(26, drawSec(t('secCurrent') + ' · ' + cnt(cur.length)));
    cur.forEach((it, i) => add(32, (c, y) => drawRow(c, y, '#' + (i + 1), it.label || t('noNote'), it.amount, it.dir)));
  }
  if (hasSaved) {
    add(26, drawSec(t('secSaved') + ' · ' + cnt(saved.length)));
    shown.forEach((it) => add(32, (c, y) => drawRow(c, y, fmtTime(it.at), it.label || t('noNote'), it.amount, it.dir)));
    if (rest > 0) add(22, (c, y) => { c.font = imgFont(11); c.fillStyle = C.muted; c.fillText(t('imgMore').replace('{n}', rest), PAD, y + 13); });
    // 有未保存行时，卡片合计含草稿，这里补一个「已保存净额」小节合计给 AA 对照；否则与卡片重复，省略
    if (cur.length) add(44, (c, y) => {
      c.font = imgFont(12); c.fillStyle = C.muted;
      c.fillText(t('sumLabel'), PAD, y + 27);
      c.textAlign = 'right';
      c.font = imgFont(15, 700);
      c.fillStyle = savedSum > 0 ? C.inc : savedSum < 0 ? C.outc : C.text;
      c.fillText((savedSum > 0 ? '+' : savedSum < 0 ? '−' : '') + fmt.format(Math.abs(savedSum)), RX, y + 27);
      c.textAlign = 'left';
    });
  }

  if (s2) {
    const even = Math.abs(s2.diff) < 0.005;
    add(12, () => {});
    add(30, (c, y) => {
      c.strokeStyle = C.border; c.lineWidth = 1;
      c.beginPath(); c.moveTo(PAD, y + 0.5); c.lineTo(RX, y + 0.5); c.stroke();
      c.font = imgFont(13, 600); c.fillStyle = C.muted;
      c.fillText(t('settleTitle'), PAD, y + 24);
    });
    add(42, (c, y) => {
      c.font = imgFont(12); c.fillStyle = C.muted;
      c.fillText(even ? t('settleEven') : s2.diff > 0 ? t('settleToMe') : t('settleToThem'), PAD, y + 24);
      if (!even) {
        c.textAlign = 'right';
        c.font = imgFont(20, 700); c.fillStyle = s2.diff > 0 ? C.inc : C.outc;
        c.fillText(money(Math.abs(s2.diff)), RX, y + 27);
        c.textAlign = 'left';
      }
    });
    const fx = [
      [t('fxMine'), money(s2.mine), t('fxMineExp').replace('{e}', money(s2.expense)).replace('{i}', money(s2.income))],
      [t('fxTotal'), money(s2.total), t('fxTotalExp').replace('{m}', money(s2.mine)).replace('{p}', money(s2.paid))],
      [t('fxEach'), money(s2.each), t('fxEachExp').replace('{t}', money(s2.total))],
      [t('fxDiff'), money(Math.abs(s2.diff)), t('fxDiffExp').replace('{e}', money(s2.each)).replace('{p}', money(s2.paid))],
    ];
    fx.forEach(([k, val, exp]) => add(42, (c, y) => {
      c.font = imgFont(12); c.fillStyle = C.muted;
      c.fillText(k, PAD, y + 14);
      c.textAlign = 'right';
      c.font = imgFont(13, 600); c.fillStyle = C.text;
      c.fillText(val, RX, y + 14);
      c.textAlign = 'left';
      c.font = imgFont(11); c.fillStyle = C.muted;
      c.fillText(clipText(c, '= ' + exp, CW), PAD, y + 33);
    }));
  }

  add(18, () => {});
  add(26, (c, y) => { c.textAlign = 'center'; c.font = imgFont(11); c.fillStyle = C.muted; c.fillText(t('imgBrand'), W / 2, y + 12); c.textAlign = 'left'; });

  const H = IMG_PAD + blocks.reduce((a, b) => a + b.h, 0) + IMG_PAD;
  // iOS Safari 有画布面积上限（约 16.7M px），长图按面积反推像素比，宁软不秃
  const MAX_AREA = 12e6;
  const scale = Math.max(1, Math.min(2, window.devicePixelRatio || 1, Math.sqrt(MAX_AREA / (W * H))));

  const cv = document.createElement('canvas');
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  const c = cv.getContext('2d');
  c.scale(scale, scale);
  c.fillStyle = C.page; c.fillRect(0, 0, W, H);
  c.textBaseline = 'alphabetic';
  let y = IMG_PAD;
  for (const b of blocks) { b.draw(c, y); y += b.h; }

  cv.toBlob((blob) => {
    if (!blob) { toast(t('imgFail')); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = t('fileStem') + '-' + new Date().toISOString().slice(0, 10) + '.png';
    a.click();
    URL.revokeObjectURL(a.href);
    toast(t('imgDone'));
  }, 'image/png');
}

input.addEventListener('input', render);
$('paidOther').addEventListener('input', () => { renderSettle(); save(); });
$('defaultDir').addEventListener('change', render);
document.querySelectorAll('.langsw .lang').forEach((b) => {
  b.addEventListener('click', () => { setLang(b.dataset.lang); applyLang(); render(); });
});
$('btnDemo').addEventListener('click', () => {
  input.value = t('demoText');
  render();
  input.focus();
});
$('btnSave').addEventListener('click', saveItem);
$('btnCopy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(input.value);
    toast(t('copied'));
  } catch (e) {
    input.select();
    toast(t('copyHint'));
  }
});
/** 导出 CSV（菜单项「导出 CSV」用） */
function exportCsv() {
  const r = parseLedger(input.value, $('defaultDir').value);
  const head = t('csvHead');
  const body = r.items
    .filter((it) => it.amount !== null)
    .map((it) => [it.line, it.label || t('noNote'), it.dir === 'in' ? t('dirIn') : t('dirOut'), it.amount.toFixed(2)]);
  const csv = [head, ...body].map((row) => row.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = t('fileStem') + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  toast(t('csvDone'));
}

/* ------------------------- 导出菜单（图片 / CSV） ------------------------- */
const menuEl = $('exportMenu');
const menuOpen = () => menuEl.classList.contains('open');
function setMenu(on) {
  menuEl.classList.toggle('open', on);
  $('exportDrop').classList.toggle('open', on);
  $('btnExport').setAttribute('aria-expanded', on ? 'true' : 'false');
}
$('btnExport').addEventListener('click', () => setMenu(!menuOpen()));
$('menuImg').addEventListener('click', () => { setMenu(false); exportImage(); });
$('menuCsv').addEventListener('click', () => { setMenu(false); exportCsv(); });
// 点空白处 / Esc 关掉菜单（菜单项在 #exportDrop 里，不会被这条误关）
document.addEventListener('click', (e) => { if (menuOpen() && !$('exportDrop').contains(e.target)) setMenu(false); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && menuOpen()) { setMenu(false); $('btnExport').focus(); }
});
$('btnClear').addEventListener('click', () => {
  if (!input.value.trim() || confirm(t('clearConfirm'))) {
    input.value = '';
    render();
    input.focus();
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    exportImage();
  }
});

load();
loadSaved();
applyLang();
render();
</script>
